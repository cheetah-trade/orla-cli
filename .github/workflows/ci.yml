name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      # node:test, no framework and no dependency to audit
      - run: node --test test/*.test.js
      # The package ships `dist/` and nothing else. If the build stopped
      # emitting the entrypoint, `npx orla` installs a package with no binary
      # and the failure lands on somebody else's machine, not here.
      - run: test -f dist/index.js
      # What `npm publish` would actually upload. A stray file in `files:` is
      # cheaper to catch here than to unpublish.
      - run: npm pack --dry-run
      # The Claude Desktop bundle builds here too: the release workflow must
      # not be the first place `zip` meets the manifest.
      - run: node scripts/build-mcpb.mjs

  # The contract copy may run ahead of production with new tools, never with a
  # changed existing one (#60, #70): Orla's own gate on the other side goes red
  # for every change there until the change lands. Production says what exists.
  contract-ahead:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-contract-ahead.mjs

  # The Claude Desktop bundle declares win32, so the suite runs there too: the
  # sign-in opened a cut-off authorize URL on Windows and no job
  # here could have seen it (review 20.11.2026, P2-4).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # the tests read the skills and the manifest line by line, as shipped (LF)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --test test/*.test.js
